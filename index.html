<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>서울 AI·정보교육 종합 추진 지도 · VR</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css" />
<style>
  :root{ --cy:#38E1D6; --am:#FFB454; --ink:#EAF2FF; --bg:#05070f; }
  html,body{margin:0;height:100%;background:var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);overflow:hidden;}
  #intro{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 20%, rgba(18,42,77,.55), rgba(5,7,15,.92) 70%);backdrop-filter:blur(2px);transition:opacity .6s ease;}
  #intro.hide{opacity:0;pointer-events:none;}
  .card{width:min(600px,90vw);padding:34px 34px 30px;border-radius:22px;
    background:linear-gradient(180deg, rgba(16,22,45,.92), rgba(9,13,28,.94));border:1px solid rgba(56,225,214,.35);
    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 40px rgba(56,225,214,.12) inset;}
  .eyebrow{font-size:14px;letter-spacing:.14em;color:var(--cy);font-weight:600;margin:0 0 10px;}
  .title{font-size:28px;font-weight:900;line-height:1.28;margin:0 0 6px;background:linear-gradient(100deg,var(--cy),var(--am));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-size:15px;color:rgba(200,216,248,.8);margin:0 0 18px;font-weight:500;}
  .steps{display:grid;gap:9px;margin:0 0 22px;padding:0;list-style:none;}
  .steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;color:rgba(224,234,255,.92);}
  .steps b.n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#06121f;background:var(--cy);font-weight:800;margin-top:1px;}
  .steps em{font-style:normal;color:var(--cy);font-weight:700;}
  .go{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;color:#04121a;background:linear-gradient(100deg,var(--cy),#7fe9df);transition:transform .12s,filter .12s;}
  .go:hover{filter:brightness(1.06);transform:translateY(-1px);} .go:disabled{filter:grayscale(.5) brightness(.8);cursor:progress;}
  .note{font-size:12.5px;color:rgba(180,198,232,.62);margin:14px 2px 0;line-height:1.5;}
  #dbg{position:fixed;left:10px;right:10px;bottom:10px;z-index:10000;display:none;background:rgba(120,20,30,.94);color:#fff;font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,120,130,.6);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:38vh;overflow:auto;}
  #introLogo{display:inline-block;height:34px;padding:8px 14px;margin:0 0 18px;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  #warp{position:fixed;inset:0;z-index:10001;display:none;pointer-events:none;background:#03040a;}
</style>
</head>

function wrap(g,t,mw){var o=[],l='';for(var i=0;i<t.length;i++){var c=t[i],x=l+c;if(g.measureText(x).width>mw&&l){o.push(l);l=c;}else l=x;}if(l)o.push(l);return o;}

var Nav={
  scene:null, ov:null, dt:null, mode:'overview',
  mount:function(scene){this.scene=scene;this.ov=document.createElement('a-entity');scene.appendChild(this.ov);this.dt=document.createElement('a-entity');scene.appendChild(this.dt);this.showOverview();},
  clear:function(gr){while(gr.firstChild){gr.removeChild(gr.firstChild);}},
  add:function(gr,canvas,w,h,pos,ry,clickable,useCard,onClick){
    var el=makeCard(canvas,w,h,clickable);

    if(ry)el.setAttribute('rotation',{x:0,y:ry,z:0});

  },

    var self=this;this.mode='overview';this.clear(this.dt);this.clear(this.ov);
    var R=4.5, Y=1.5;
    function P(az,y,r){var d=az*Math.PI/180;r=r||R;return {x:r*Math.sin(d), y:y, z:-r*Math.cos(d)};}

    this.add(this.ov, makeGroupHeader('정보교육 중장기 발전계획','디지털 소양과 컴퓨팅 사고력을 키우는 정보교육', AM), 2.9,0.83, P(50,2.98,5.3), -50, false,false,null);

function buildScene(){
  var scene=document.createElement('a-scene');
  scene.setAttribute('background','color: #05070f');
  scene.setAttribute('fog','type: linear; color: #060a18; near: 12; far: 40');
  scene.setAttribute('vr-mode-ui','enabled: true');
  scene.setAttribute('loading-screen','enabled: false');
  scene.setAttribute('webxr','optionalFeatures: hand-tracking, local-floor');
  scene.setAttribute('renderer','antialias: true; colorManagement: true; foveationLevel: 1; highRefreshRate: true');

  var cam=document.createElement('a-camera');cam.setAttribute('position','0 1.6 0');cam.setAttribute('camera','fov: 74');cam.setAttribute('wasd-controls-enabled','false');cam.setAttribute('look-controls','pointerLockEnabled: false');
  scene.appendChild(cam);

  var mcur=document.createElement('a-entity');mcur.setAttribute('cursor','rayOrigin: mouse');mcur.setAttribute('raycaster','objects: .clickable; far: 40');scene.appendChild(mcur);
  [['right',0.85],['left',0.5]].forEach(function(h){var l=document.createElement('a-entity');l.setAttribute('laser-controls','hand: '+h[0]);l.setAttribute('raycaster','objects: .clickable; far: 40; lineColor: #38E1D6; lineOpacity: '+h[1]);scene.appendChild(l);});

  var stars=document.createElement('a-entity');stars.setAttribute('starfield','');scene.appendChild(stars);
  var skyfx=document.createElement('a-entity');skyfx.setAttribute('skyfx','');scene.appendChild(skyfx);

  var sky=document.createElement('a-sky');
  sky.addEventListener('loaded',function(){var m=sky.getObject3D('mesh');if(!m)return;var c=document.createElement('canvas');c.width=8;c.height=512;var g=c.getContext('2d');var gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#05070f');gr.addColorStop(0.5,'#070c1c');gr.addColorStop(0.72,'#0a1633');gr.addColorStop(0.85,'#070c1c');gr.addColorStop(1,'#04060d');g.fillStyle=gr;g.fillRect(0,0,8,512);m.material=new THREE.MeshBasicMaterial({map:tex(c),side:THREE.BackSide});});
  scene.appendChild(sky);

  /* 바닥 없이 전체 우주(별) — 위/아래 모두 별로 채움 */

  Nav.mount(scene);
  camEl=cam;
  document.body.appendChild(scene);
}

var started=false, sceneBuilt=false, camEl=null;
function onReady(){
  if(started)return;started=true;
  try{
    registerComponents();
    Promise.all([document.fonts.load('900 82px "Pretendard"'),document.fonts.load('700 36px "Pretendard"'),document.fonts.load('500 34px "Pretendard"')]).catch(function(){}).then(function(){

    }).catch(function(){}).then(function(){
      try{buildScene();sceneBuilt=true;var b=document.getElementById('startBtn');b.disabled=false;b.textContent='공간 둘러보기 시작';}
      catch(err){showDbg('buildScene 실패: '+(err&&err.message?err.message:err));}
    });
  }catch(err){showDbg('onReady 실패: '+(err&&err.message?err.message:err));}
}
var SRC=['https://cdn.jsdelivr.net/npm/[email protected]/dist/aframe-master.min.js','https://aframe.io/releases/1.7.1/aframe.min.js','https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js'];
function loadAframe(i){if(typeof AFRAME!=='undefined'){onReady();return;}if(i>=SRC.length){showDbg('A-Frame 로드 실패: 네트워크/차단 여부 확인');return;}var s=document.createElement('script');s.src=SRC[i];s.async=false;s.onload=function(){(typeof AFRAME!=='undefined')?onReady():loadAframe(i+1);};s.onerror=function(){loadAframe(i+1);};document.head.appendChild(s);}
if(document.readyState==='complete')loadAframe(0);else window.addEventListener('load',function(){loadAframe(0);});
function warpSound(){try{var ac=new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  f.type='lowpass';f.frequency.setValueAtTime(180,ac.currentTime);f.frequency.exponentialRampToValueAtTime(4200,ac.currentTime+2.2);
  o.type='sawtooth';o.frequency.setValueAtTime(55,ac.currentTime);o.frequency.exponentialRampToValueAtTime(440,ac.currentTime+2.4);
  g.gain.setValueAtTime(0.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.13,ac.currentTime+1.2);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+2.6);
  o.connect(f);f.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+2.7);}catch(e){}}
function runWarp(done){
  var cv=document.getElementById('warp');cv.style.display='block';cv.style.opacity='1';var ctx=cv.getContext('2d');
  var W,H,cx,cy;function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;cx=W/2;cy=H/2;}resize();window.addEventListener('resize',resize);
  var N=520,stars=[];for(var i=0;i<N;i++)stars.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*0.9+0.1});
  ctx.fillStyle='#03040a';ctx.fillRect(0,0,W,H);
  var start=performance.now(),DUR=2600;
  function frame(now){
    var t=(now-start)/DUR;
    ctx.fillStyle='rgba(3,4,10,0.28)';ctx.fillRect(0,0,W,H);
    var speed=0.004+t*t*0.075, scale=Math.min(W,H)*0.9;
    for(var i=0;i<N;i++){var s=stars[i];var pz=s.z;s.z-=speed;
      if(s.z<=0.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;continue;}
      var k=scale/s.z,pk=scale/pz;var x=cx+s.x*k,y=cy+s.y*k,px=cx+s.x*pk,py=cy+s.y*pk;
      var b=Math.min(1,(1-s.z)*1.25);
      ctx.strokeStyle='rgba('+Math.round(130+125*b)+','+Math.round(205+50*b)+',255,'+(0.45+0.55*b).toFixed(3)+')';
      ctx.lineWidth=Math.max(1,2.6*(1-s.z));ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();}
    if(t<1){requestAnimationFrame(frame);}
    else{ctx.fillStyle='rgba(210,242,255,0.92)';ctx.fillRect(0,0,W,H);cv.style.transition='opacity 0.6s ease';cv.style.opacity='0';
      setTimeout(function(){cv.style.display='none';cv.style.transition='';window.removeEventListener('resize',resize);if(done)done();},640);}
  }
  requestAnimationFrame(frame);
}
document.getElementById('startBtn').addEventListener('click',function(){if(!sceneBuilt)return;document.getElementById('intro').classList.add('hide');warpSound();runWarp();});

/* 오른쪽 하단 VR 버튼 → 문서 전체 전체화면만 (인트로/들어가기 버튼 유지) */

  var btn=(e.target&&e.target.closest)?e.target.closest('.a-enter-vr-button'):null;

      var rf=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
      if(rf)rf.call(el);
    }
  }catch(err){}
},true);
